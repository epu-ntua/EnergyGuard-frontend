# Server-only overlay: attach the web container to the nginx-proxy network and
# to the networks of the assessment backends.
#
#   docker compose -f docker-compose.yml -f docker-compose.server.yml up -d
#
# This exists so the server needs NO local edits to a tracked file. Until now
# docker-compose.yml was modified in place on the server to uncomment these
# networks, which means every `git pull` that touches that file conflicts.
#
# It is a genuine overlay, not a second copy of the stack: networks are additive
# under Compose's merge rules, so there is nothing to duplicate. (Volumes are
# not additive in the same useful way - an overlay cannot *remove* the `.:/app`
# bind mount, which is why there is no separate full production file.)
#
# The external networks are created by the nginx-proxy stack and by the code
# analysis and robustness backends' own stacks, so `up` fails here if any of
# them has not been started.

services:
  web:
    networks:
      - default
      - energyguard_net
      - robustness_net
      - code_analysis_net

networks:
  energyguard_net:
    external: true
    name: nginxproxy_energyguard_net
  # The assessment backends publish their ports on 127.0.0.1 only, which a
  # container can't reach. web calls them by container name on their networks
  # instead: ROBUSTNESS_API_URL=http://robustness-backend:9003 and
  # SCAN_API_URL=http://code_analysis_backend:5000 in .env. The scans run in
  # web's threads, so qcluster needs neither.
  robustness_net:
    external: true
    name: robustness-network
  code_analysis_net:
    external: true
    name: energyguard-code-quality_code-analysis-net
