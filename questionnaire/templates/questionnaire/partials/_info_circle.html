{% if show_extras and obj.more_info %}
    <span class="ai-act-info-wrap">
        <button type="button" class="btn btn-outline-secondary rounded-circle p-0 ai-act-info-btn"
                aria-label="More info">
            <i class="fa-solid fa-info"></i>
        </button>
        <span class="ai-act-popover-content" role="tooltip">
            <strong class="d-block mb-1"><i class="fa-solid fa-circle-info me-1"></i>More information</strong>
            {{ obj.more_info|linebreaksbr }}
        </span>
    </span>
{% endif %}
