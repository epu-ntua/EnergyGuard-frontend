<!-- Details + Datasets -->
<div class="row g-4 mb-8">
  <!-- Details -->
  <div class="col-12 col-lg-4 col-xl-3">
    <div class="card h-100">
      <div class="card-body p-4">
        <h6 class="text-uppercase text-body-tertiary fw-bold mb-3" style="letter-spacing:.08em;">Details</h6>
        <dl class="row gy-2 mb-0 fs-9">
          <dt class="col-5 fw-normal text-body-tertiary"><span class="fa-solid fa-tag fa-fw me-2"></span>Type</dt>
          <dd class="col-7 mb-0 fw-semibold text-body-emphasis">{{ project_details.type|default:"-" }}</dd>

          <dt class="col-5 fw-normal text-body-tertiary"><span class="fa-regular fa-calendar-days fa-fw me-2"></span>Created</dt>
          <dd class="col-7 mb-0 fw-semibold text-body-emphasis">{{ project_details.start_date|date:"j M Y" }}</dd>

          {% if project_details.team %}
          <dt class="col-5 fw-normal text-body-tertiary"><span class="fa-solid fa-user-group fa-fw me-2"></span>Team</dt>
          <dd class="col-7 mb-0 fw-semibold text-body-emphasis">{{ project_details.team }}</dd>
          {% endif %}
        </dl>
      </div>
    </div>
  </div>

  <!-- Datasets -->
  <div class="col-12 col-lg-8 col-xl-9">
    {% include "projects/partials/project-datasets.html" %}
  </div>
</div>
