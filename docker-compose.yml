# One stack for both machines. Deployment is `git pull` + restart, so the source
# tree is bind-mounted everywhere and the only difference is which server runs.
#
# Locally: nothing to set. `docker compose up` gives you Django's auto-reloading
# development server.
#
# On the server: set WEB_SERVER_CMD in .env so the production server runs instead
# of runserver, which is single-process, auto-reloading and explicitly not
# security-audited:
#
#   WEB_SERVER_CMD=gunicorn main.wsgi:application --bind 0.0.0.0:8000 --worker-class gthread --workers 3 --threads 8 --timeout 120
#
# 3 workers x 8 threads = 24 requests at once. The slow requests (EnGreen and
# CIEMAT simulations, data lake queries, streamed downloads) wait on the network
# for up to 30s each, so 8 of them at once were enough to stall every other page
# when there was a single 8-thread worker. Threads cover that waiting; the extra
# workers let Python use more than one of the VM's 4 cores, which it shares with
# the database, MinIO and the other services, hence 3 rather than gunicorn's
# usual 2 x cores + 1. Each worker holds its own copy of the cached Riga
# buildings (~150 MB), so mind the memory before raising it further.
#
# Every job's state lives in the database (code_analysis and robustness read it
# from their Assessment), so any worker can answer any request. Keep it that
# way: state kept in a module-level variable is per-worker.
#
# Also set BIND_ADDR=127.0.0.1 in the server's .env so the published ports (web
# 8080, pgadmin 5051) are reachable only from the VM itself. Docker publishes
# ports on 0.0.0.0 by default, which bypasses ufw. Open the server's pgadmin
# through an SSH tunnel: ssh -L 5051:localhost:5051 <user>@<server>. Nginx Proxy
# Manager reaches web over the docker network, not through 8080. With 8080 open
# to the internet, scanners connected straight to gunicorn, never finished their
# requests, and held all 8 gthread threads until the site hung with a 504. Nginx
# buffers the full request before forwarding it, so slow clients only reach
# gunicorn by bypassing it.
#
# The server also needs the nginx-proxy network. That lives in
# docker-compose.server.yml rather than being edited in here, so this tracked
# file stays identical on both machines and `git pull` never conflicts:
#
#   docker compose -f docker-compose.yml -f docker-compose.server.yml up -d

# Docker keeps a container's logs, unrotated, until the container is recreated.
# Cap them at 5 files of 10 MB per service, the oldest dropped first. Changing
# this takes effect only for recreated containers (`up -d`, not `restart`).
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

services:
  web:
    build: .
    # exec, so signals reach the server process instead of the wrapping shell.
    # fail_interrupted_assessments must run here, before the server: the
    # assessment jobs it fails ran in the threads of the server that just stopped.
    command: >
      sh -c "
      python manage.py migrate &&
      python manage.py fail_interrupted_assessments &&
      python manage.py createcachetable &&
      python manage.py collectstatic --noinput &&
      exec ${WEB_SERVER_CMD:-python manage.py runserver 0.0.0.0:8000}
      "
    volumes:
      - .:/app
      - static_volume:/app/staticfiles
    ports:
      - "${BIND_ADDR:-0.0.0.0}:${PORT:-8080}:8000"
    env_file:
      - .env
    depends_on:
      - db
    restart: always
    logging: *logging

  db:
    image: postgres:16
    volumes:
      - postgres_data:/var/lib/postgresql/data
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: always
    logging: *logging

  qcluster:
    build: .
    command: python manage.py qcluster
    volumes:
      - .:/app
    env_file:
      - .env
    depends_on:
      - db
    restart: always
    logging: *logging

  pgadmin:
    image: dpage/pgadmin4
    ports:
      - "${BIND_ADDR:-0.0.0.0}:5051:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - db
    restart: always
    logging: *logging

volumes:
  postgres_data:
  pgadmin_data:
  static_volume:
